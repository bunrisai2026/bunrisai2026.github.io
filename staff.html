<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>スタッフ用 待ち時間更新 | 文理祭 2026</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/wait.css">
</head>
<body class="wait-body">

<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="index.html">文理祭<span>2026</span></a>
    <a class="btn btn-outline btn-small" href="wait.html">来場者用ページ</a>
  </div>
</header>

<main class="wait-main">
  <div class="container">

    <section id="pinGate" class="pin-gate">
      <span class="section-kicker">Staff</span>
      <h1 class="section-title">スタッフ用ページ</h1>
      <p class="wait-lead">担当の人からもらった合言葉を入力してください。</p>
      <form id="pinForm" class="pin-form">
        <input id="pinInput" type="password" inputmode="text" placeholder="合言葉" required>
        <button type="submit" class="btn btn-primary">入る</button>
      </form>
      <p id="pinError" class="wait-error" hidden>合言葉が違います。もう一度確認してください。</p>
    </section>

    <section id="staffPanel" class="staff-panel" hidden>
      <span class="section-kicker">Staff</span>
      <h1 class="section-title">待ち時間の更新</h1>
      <p class="wait-lead">自分の担当する出し物の待ち時間を更新してください。変更は来場者用ページにすぐ反映されます。</p>

      <ul id="staffBoothList" class="staff-list"></ul>

      <div class="staff-add">
        <h2 class="staff-add-title">出し物を追加</h2>
        <form id="addBoothForm" class="add-form">
          <input name="boothName" type="text" placeholder="出し物名（例：お化け屋敷）" required>
          <input name="location" type="text" placeholder="場所（例：1-A教室）任意">
          <button type="submit" class="btn btn-outline">追加</button>
        </form>
        <p class="staff-seed-hint">まだ何も登録されていないときは、下のボタンでクラス企画（承認済み21件）をまとめて登録できます。</p>
        <button type="button" id="seedBoothsBtn" class="btn btn-outline">クラス企画を一括登録（21件）</button>
      </div>
    </section>

  </div>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <p>文理祭実行委員会</p>
  </div>
</footer>

<script type="module" src="js/wait-staff.js"></script>
</body>
</html>
